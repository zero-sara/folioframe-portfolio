<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>全诗越 — FolioFrame</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;700&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap');

* { box-sizing:border-box; } html { scroll-behavior:smooth; }
body { margin:0; background:var(--paper); color:var(--ink); font-family:var(--editor-font,'Noto Sans SC'),sans-serif; font-size:var(--editor-body-size,16px); font-weight:var(--editor-font-weight,400); }
button,a { font:inherit; } button { color:inherit; }
/* 页面底边留白：脚注是整页最后一个元素，所以这段 padding 就是「脚注到页面底边」的距离。
 * 以前固定 80px，看起来像脚注永远悬在离底边一段的位置、怎么调间距都贴不到底；
 * 现在由「页脚下方留白」这根间距杆控制（--ff-page-bottom），默认 28px，脚注紧贴页面底边。 */
.shell { max-width:1440px; margin:auto; padding:24px 42px var(--ff-page-bottom,28px); }
.top { display:flex; justify-content:space-between; align-items:center; padding-bottom:75px; font:12px 'DM Mono',monospace; text-transform:uppercase; letter-spacing:.04em; }
.status { color:var(--accent); }
/* —— FolioFrame 固定字标 ——
 * 与工作台顶栏 .st-brand 完全同款（Playfair Display 600 的 "Folio" + 强调色大写 "FRAME"）。
 * 这是产品标识，不是用户内容：刻意不挂任何 data-field / data-ve-item，
 * 所以任何编辑模式、任何模板、任何人来用，它都固定是 FolioFrame，改不掉也不会被导出成别人的东西。
 * .top 上的 text-transform:uppercase 会污染 Playfair 的大小写，这里显式收回。 */
.top-brand { display:inline-flex; align-items:baseline; gap:8px; text-transform:none; }
.top-brand-sep { color:var(--muted); }
.ff-lockup { font:600 15px/1 'Playfair Display',Georgia,serif; letter-spacing:.01em; white-space:nowrap; text-transform:none; }
/* ⚠ 这里的强调色必须写死 #e64e2e（= 工作台的 --st-accent），**不能用 var(--accent)**：
 * 作品集页的 --accent 是主题变量，换主题会变成墨蓝/橄榄等其他颜色，
 * 品牌标识就跟着内容主题漂移了 —— 实测在深色主题下会渲染成 rgb(31,78,140)。
 * 产品标识必须恒定，所以在哪套主题下都是同一个橙色。 */
.ff-lockup em { font-style:normal; color:#e64e2e; margin-left:4px; font-family:'DM Mono',monospace; font-size:12px; letter-spacing:.08em; text-transform:uppercase; }

/* Hero — 不再展示 About Me 全文，只展示一句 intro，避免重复 */
.hero { min-height:0; display:flex; flex-direction:column; justify-content:flex-end; padding-bottom:var(--editor-spacing,48px); border-bottom:1px solid var(--ink); }
/* 眉标(Selected works) 与姓名同属「Hero 标题块」：眉标在下方的间距由间距杆控制
   （.heroNameGap → .eyebrow 的 margin-bottom），保证两者作为一个整体随顶部留白一起移动。 */
.hero .hero-text > .eyebrow { display:block; margin-bottom:8px; }
.eyebrow { display:block; margin-bottom:8px; }
h1 { margin:0; max-width:900px; text-align:var(--editor-align,left); }

/* Directory */
.directory { margin-top:42px; }
.entry { border-top:1px solid var(--ink); }
.entry:last-child { border-bottom:1px solid var(--ink); }
.entry-btn { width:100%; border:0; background:none; padding:22px 0; display:grid; grid-template-columns:70px 1fr auto; align-items:center; text-align:left; cursor:pointer; }
.entry-no { font:13px 'DM Mono',monospace; color:var(--accent); }
.entry-panel { display:none; padding:0 0 42px 70px; }
.entry.open .entry-panel { display:block; }

.experience { border-top:1px solid var(--line); }

/* Works */
.works-group { border-top:1px solid var(--line); padding:30px 0 14px; }
.works-group:first-child { border-top:0; padding-top:0; }

/* Showreel */
.showreel { background:var(--dark); color:#f4f0e8; padding:36px; margin-top:60px; }

/* Case */
.case-head { display:flex; justify-content:space-between; gap:30px; margin-bottom:28px; }
.case-head h2 { font:500 34px 'Playfair Display',serif; margin:8px 0; }
.case-cover { width:100%; max-height:450px; object-fit:cover; background:var(--soft); }
.case-flow { border-top:1px solid var(--line); margin-top:24px; }
.case-step { display:grid; grid-template-columns:230px 1fr; padding:20px 0; border-bottom:1px solid var(--line); }
.case-step strong { font-weight:500; }
.case-step p { margin:0; color:#55514a; line-height:1.7; }
.buttons { display:flex; gap:10px; margin-top:28px; }
.button { display:inline-block; padding:12px 18px; border:1px solid var(--ink); text-decoration:none; color:var(--ink); font:12px 'DM Mono',monospace; }
.button:hover { background:var(--ink); color:var(--paper); }
.resume { display:flex; justify-content:space-between; align-items:end; gap:30px; }
.resume h2 { font:500 30px 'Playfair Display',serif; margin:8px 0; }
.contact { margin-top:28px; padding-top:20px; border-top:1px solid var(--line); line-height:2; font-size:14px; }
.contact a { color:inherit; }
.footer { margin-top:80px; font:12px 'DM Mono',monospace; color:var(--muted); }
/* Resume 弹窗（View Resume） */
/* z-index 要高于底部状态条(#version-bar, 9999)：弹窗打开时应当独占屏幕，遮住页面上的浮层 */
.resume-modal { position:fixed; inset:0; z-index:10001; display:flex; align-items:center; justify-content:center; }
.resume-modal[hidden] { display:none; }
.resume-modal-backdrop { position:absolute; inset:0; background:rgba(20,18,16,.55); cursor:pointer; }
/* 弹窗外框：默认就尽量大（JS 再按文件比例调整宽度，且只放大不缩小），高度 = head + 预览区 */
.resume-modal-card { position:relative; width:min(1200px,96vw); max-width:96vw; max-height:95vh; display:flex; flex-direction:column; background:var(--paper); color:var(--ink); border:1px solid var(--ink); box-shadow:0 24px 70px rgba(0,0,0,.4); }
.resume-modal-head { flex:0 0 auto; display:flex; justify-content:space-between; align-items:center; gap:16px; padding:8px 14px; border-bottom:1px solid var(--line); min-width:0; }
/* 标题禁止换行：宽度变化时不改变头部高度，JS 才能算出稳定的预览区尺寸 */
.resume-modal-title { font:500 17px 'Playfair Display',serif; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; }
.resume-modal-actions { display:flex; gap:10px; align-items:center; flex:0 0 auto; }
/* 头部按钮压缩一档：头部每省 1px，预览区（正文字号）就多 1px */
.resume-modal-actions .button { padding:7px 12px; }
/* 查看方式切换（仅 PDF）：适应宽度 = 字大但要滚动；整页 = 一屏看全但字小。物理上不可兼得，交给用户选 */
.resume-mode { display:flex; align-items:stretch; border:1px solid var(--line); flex:0 0 auto; }
.resume-mode button { padding:7px 10px; font:12px 'DM Mono',monospace; background:transparent; color:var(--ink); border:0; cursor:pointer; white-space:nowrap; }
.resume-mode button + button { border-left:1px solid var(--line); }
.resume-mode button.active { background:var(--ink); color:var(--paper); }
/* 预览区高度由 JS 写入（FF_resumeApplyFit：吃满视口高度，文件越大越好读）；72vh 只是未跑 JS 时的兜底。
   overflow:hidden —— 文件应当整页缩放进这块区域，不该出现滚动条。
   底色用浅灰（不是纯白）：PDF 查看器自带的页面底色就是灰的，「整页」模式下两侧留白才不会连成一片白。 */
.resume-modal-body { flex:0 0 auto; height:72vh; min-height:0; display:flex; align-items:center; justify-content:center; background:#e9e9ea; overflow:hidden; }
.resume-frame { width:100%; height:100%; border:0; background:#fff; display:block; }
.resume-image { width:100%; height:100%; object-fit:contain; background:#fff; display:block; }
.resume-nopreview { width:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; padding:48px; text-align:center; }
.resume-open-link { color:var(--accent); text-decoration:underline; }
/* 下载按钮：允许=随主题强调色高亮；不允许=灰色禁用 */
.button.resume-download:not(.resume-disabled) { background:var(--accent); color:var(--paper); border-color:var(--accent); }
.button.resume-download:not(.resume-disabled):hover { filter:brightness(.92); }
.button.resume-download.resume-disabled { background:transparent; color:var(--muted); border-color:var(--line); cursor:not-allowed; opacity:.7; }
.resume-close { padding:8px 12px; }
.ai-media { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:14px; }
.ai-media img { width:100%; aspect-ratio:16/9; object-fit:cover; background:var(--soft); }

@media(max-width:720px){
  .shell{padding:18px 20px var(--ff-page-bottom,28px)}
  .top{padding-bottom:52px}
  .hero{min-height:0}
  .entry-btn{grid-template-columns:48px 1fr auto}
  .entry-panel{padding-left:0}
  .case-head,.resume{display:block}
  .case-step{grid-template-columns:1fr;gap:8px}
  .case-head h2{font-size:28px}
  .ai-media{grid-template-columns:1fr}
  .showreel{padding:20px;margin-left:-20px;margin-right:-20px}
  .chapter{grid-template-columns:96px 1fr}
  .ch-role{grid-column:2}
}

/* V4: 主题预设 + 字体层级 + Type 字段 + Experience 不显示 Key Work + About 不重复 */

:root {
  --ink:#161616; --paper:#f1eee7; --soft:#ede9df; --line:#cac5ba;
  --accent:#e64e2e; --muted:#77736b; --dark:#20201e; --hero-eyebrow:#e64e2e;
}

/* —— 展开标识：明确的朝下 chevron + 文字，展开后朝上 —— */
.chev{display:inline-block;width:10px;height:10px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:rotate(45deg);transition:transform .25s ease}
.expand-label{display:inline-flex;align-items:center;gap:9px;color:var(--muted);font-size:13px;font-weight:400}
.expand-label .chev{opacity:.85}
.expand-text{white-space:nowrap}
.entry{transition:opacity .22s ease,filter .22s ease,transform .22s ease;scroll-margin-top:18px}
.entry.open{position:relative;z-index:1}
.entry.open .entry-btn{background:color-mix(in srgb,var(--paper) 84%,var(--accent) 16%)}
.directory:has(.entry.open) .entry:not(.open){opacity:.48;filter:blur(.25px)}
@media (prefers-reduced-motion: reduce){.entry{transition:none}.directory:has(.entry.open) .entry:not(.open){filter:none}}
details[open]>.project-head .chev,
.entry.open .entry-btn .chev,
details[open].experience-item>summary .chev,
details[open].project>summary .chev{transform:rotate(-135deg)}

/* 隐藏原生 details 三角 */
summary::-webkit-details-marker{display:none}
summary{list-style:none}

/* —— 字体层级递减（明显但不极端）—— */
/* Section(目录) > Hero > Category > Project > Metadata > Body */
.entry-title{font-size:clamp(22px,2.6vw,34px);font-weight:500;letter-spacing:-.02em}
h1{font-size:clamp(40px,7vw,96px);line-height:1;letter-spacing:-.04em;font-weight:500}
.role{font-size:clamp(16px,1.8vw,22px);font-weight:400;margin:0}
.intro{font-size:15px;line-height:1.7;color:var(--muted);margin-top:10px}

/* Works Category：比 entry 小，比 project 大；letter-spacing + weight 提升层次 */
.works-group{border-top:1px solid var(--line);padding:0}
.works-category-head{display:flex;align-items:center;gap:16px;cursor:pointer;padding:20px 0;list-style:none}
.works-category{font-size:clamp(18px,1.9vw,22px);font-weight:500;margin:0;letter-spacing:-.005em;color:var(--ink)}
.works-count{font:500 12px 'DM Mono',monospace;color:var(--muted);letter-spacing:.05em}
.works-category-head .expand-label{margin-left:auto}
.works-category-body{padding:0 0 26px;border-left:2px solid var(--line);margin-left:6px;padding-left:24px}
.works-intro{font-size:13px;color:var(--muted);margin:0 0 18px;line-height:1.6}

/* Project：中等字号，作为层级第二级（比 Category 小一级） */
.project h4{font-size:16px;font-weight:500;margin:0;letter-spacing:-.005em}
.project-role{font-size:13px;color:var(--muted);font-weight:400}
.project-role i{font-style:normal;color:var(--muted);font-size:12px}
.project-role .project-type{font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--accent);opacity:.85;margin:0 8px;border-left:1px solid var(--line);padding-left:8px}

.project-summary{font-size:15px;line-height:1.75;color:#45413b;margin:0 0 6px}
.label{font-size:11px;letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
.bodycopy{font-size:16px;line-height:1.85}

/* —— 项目详情：单列流式，有媒体时自适应分栏 —— */
.project{border-top:1px solid var(--line);padding:18px 0}
/* 未展开(简略)项目：与隔离横线间距更紧凑，但上下对称，避免整体不协调 */
.project-compact{border-top:1px solid var(--line);padding:12px 0}
.project-head{display:flex;align-items:baseline;gap:18px;cursor:pointer;padding:4px 0;list-style:none}
.project-head h4{margin:0}
.project-head .project-role{margin-left:auto;display:flex;gap:8px;align-items:baseline}
.project-toggle{margin-left:12px;flex-shrink:0}
.project-compact .project-head{cursor:default}
.project-compact .key-work{margin-top:10px}
/* —— 项目详情：正文 + 媒体栏。媒体（图片 / 视频 / 音频）全在同一栏，比例用百分比定义，
   所以画布（窄）与浏览器（宽）看到的分栏比例完全一致 —— 所见即所得。 —— */
.project-detail{display:block;margin-top:18px}
.project-main{min-width:0}
.project-summary{margin:0 0 6px}

/* 媒体栏：--pm-w 由 Design 的 imgSizes（projects.N.media.widthPct）控制，可在排版编辑里拖动/调数值 */
.project-media{min-width:0}
.media-stack{display:flex;flex-direction:column;gap:16px}
.pm-item{margin:0;min-width:0}
/* —— 单个媒体项独立尺寸 ——
   --pmi-w 来自 Design 的 mediaItems['projects.N.media#image0'].widthPct（10–100），
   默认 100% = 撑满所在容器。图片 / 视频 / 音频各有一条独立数值，互不影响。
   对齐用 auto margin（flex 纵向布局里就是左右对齐），左=默认。 */
.pm-item{width:var(--pmi-w,100%);max-width:100%}
.pm-item.pmi-c{margin-left:auto;margin-right:auto}
.pm-item.pmi-r{margin-left:auto;margin-right:0}
/* 「正文下方」落点：媒体项脱离侧栏后在这里整行排列。
   关键：这里是「流式整行区」——flex-wrap 横向排列，默认一行放 3 个，
   拖手柄或点工具条「一行 N 个」即可变成 2 个 / 1 个 / 4 个一排。
   宽度用 --pmi-w（百分比，扣掉 gap），所以三张等宽横图能刚好落在同一条水平线上。 */
.project-media-below{display:flex;flex-wrap:wrap;gap:var(--below-gap,16px);align-items:flex-start;margin-top:18px}
.project-media-below>.pm-item{
  flex:0 0 auto;
  width:var(--pmi-w,calc((100% - 32px)/3));
  margin-left:0;margin-right:0;   /* 整行对齐交给容器 justify-content，单项不再用 auto margin 抢位 */
}
/* 整行对齐（左 / 居中 / 右）——存在 design.mediaLayout[<媒体路径>].belowAlign */
.project-media-below.jc-center{justify-content:center}
.project-media-below.jc-right{justify-content:flex-end}
/* 对称模式：整行居中 + 共享间距——居中后拖一张往一侧，其它项自动沿中线反向挪（用户要的"对称"） */
.project-media-below.symmetric{justify-content:center}
/* 并排时统一按同一高度基准对齐顶部，避免高低不齐显得乱 */
.project-media-below>.pm-item>*{margin-top:0}
@media(min-width:900px){
  .project-detail:not(.no-media) .project-media-below{grid-column:1/-1;grid-row:2}
}
.pm-image img{width:100%;height:auto;display:block;background:var(--soft)}
.pm-video video,.pm-audio audio{width:100%;display:block}
.pm-video video{background:var(--dark);max-height:520px;object-fit:contain}
/* 浏览器解不了的封装（ProRes / MOV）：说明 + 原文件入口，而不是一个永远黑屏的播放器 */
.pm-unsupported{
  border:1px dashed var(--line);background:var(--soft);padding:16px 18px;
  font-size:13px;line-height:1.7;color:#4a463f;
}
.pm-unsupported strong{display:block;font-size:14px;color:var(--ink);margin-bottom:6px}
.pm-unsupported p{margin:0 0 10px}
.pm-unsupported .pm-link{font:12px 'DM Mono',monospace;color:var(--ink);border-bottom:1px solid var(--line);text-decoration:none}

@media(min-width:900px){
  .project-detail:not(.no-media){
    display:grid;
    grid-template-columns:minmax(0,1fr) minmax(0,var(--pm-w,38%));
    gap:34px;align-items:start;
  }
  .project-detail:not(.no-media) .project-media{grid-column:2;grid-row:1}
  .project-detail:not(.no-media) .project-main{grid-column:1;grid-row:1}
  /* 媒体位置：右（默认）/ 左。左侧时媒体栏排第一列，正文自动落到第二列。 */
  .project-detail.media-on-left .project-media,
  .project-detail .project-media.media-left{grid-column:1}
  .project-detail.media-on-left .project-main{grid-column:2}
}


/* Key Work：短专业术语 chips */
.key-work{margin-top:16px}
.key-work ul{list-style:none;padding:0;margin:8px 0 0;display:flex;flex-wrap:wrap;gap:7px}
.key-work li{border:1px solid var(--line);border-radius:3px;padding:5px 11px;font-size:13px;line-height:1.2;background:var(--soft)}

/* Highlights：列表 */
.highlights{margin-top:16px}
.highlights ul{margin:8px 0 0;padding-left:18px;line-height:1.75;font-size:14px}
.highlights li{margin:4px 0}

/* —— 媒体：内容驱动，不预留空列，不撑破正文 —— */
.project-main video{width:100%;max-height:460px;background:var(--dark);margin-top:18px}
.project-main audio{width:100%;margin-top:14px}
.project-link{display:inline-block;margin-top:14px;margin-right:18px;color:var(--ink);font:12px 'DM Mono',monospace;text-decoration:none;border-bottom:1px solid var(--line)}

/* 窄屏（<900px）：媒体栏排在正文之后，单列堆叠 */
@media(max-width:899px){
  .project-media{margin-top:20px}
}

/* —— Experience：横向 / 时间导向，与 Works 完全不同的排版 —— */
/* 不再展示 Key Work。整行作为时间线条目，Company/Position/Date 排在一行，展开后 summary+highlights。 */
.experience{border-top:1px solid var(--line);counter-reset:exp}
.experience-item{border-bottom:1px solid var(--line);padding:0}
.experience-item summary{
  display:grid;
  grid-template-columns:36px 1.6fr 1.4fr 1fr auto;
  gap:18px;
  align-items:center;
  padding:18px 0;
  cursor:pointer;
  position:relative;
}
.experience-item summary::-webkit-details-marker{display:none}
.experience-item summary::before{
  counter-increment:exp;
  content:counter(exp,decimal-leading-zero);
  font:500 12px 'DM Mono',monospace;
  color:var(--accent);
  letter-spacing:.05em;
}
.exp-company{font-weight:500;font-size:17px;letter-spacing:-.005em}
.exp-position{font-size:13px;color:var(--ink);opacity:.8}
.exp-date{font:500 12px 'DM Mono',monospace;color:var(--muted);letter-spacing:.05em;text-transform:uppercase;text-align:right}
.exp-body{padding:4px 0 24px 54px;border-left:1px dashed var(--line);margin-left:18px}
.exp-summary{margin:0 0 16px;max-width:680px;line-height:1.75;color:#4a463f;font-size:15px}
.exp-hl{margin-top:4px}
.exp-hl ul{margin:8px 0 0;padding-left:0;list-style:none;display:grid;gap:8px}
.exp-hl li{padding-left:18px;position:relative;line-height:1.7;font-size:14px;color:#3e3a33}
.exp-hl li::before{content:'';position:absolute;left:0;top:11px;width:6px;height:1px;background:var(--accent)}

@media(max-width:720px){
  .experience-item summary{grid-template-columns:28px 1fr auto;gap:10px}
  .exp-position,.exp-date{grid-column:2;font-size:12px}
  .exp-body{padding-left:0;margin-left:10px}
}

/* —— Hero：不再重复 About Me 全文 —— */
.hero{padding-bottom:var(--editor-spacing,48px);display:flex;justify-content:space-between;align-items:flex-start;gap:40px;position:relative;border-bottom:0}
.hero-text{flex:1 1 auto;min-width:0}
/* 个人形象：默认作为 hero 右上方的独立浮层（absolute），绝不挤压文字流；
   也可由 design.pixel.x/y 给绝对坐标拖拽定位。内部 img 承载三态动画。 */
.hero-avatar{flex:0 0 auto;align-self:flex-start;margin-top:2px;display:flex;align-items:flex-start;justify-content:flex-end;z-index:6}
.hero-avatar img{display:block;image-rendering:pixelated;image-rendering:crisp-edges;border-radius:6px;max-width:none}
.ve-embed .ve-pixel{cursor:grab;user-select:none}
.ve-embed .ve-pixel.ve-el-selected{cursor:grabbing}
/* Pixel 交互：形象指针悬停/点击时的随机动作（播一次即停，不循环）。
   三个动作：
     - jump       = 跳两下立住（约 1.2s）。原地执行。
     - sway-idle  = 原地左右摇晃（约 0.9s，±14°）。原地执行。
     - sway-walk  = 边走边摇晃（沿 path 移动 + 脚步摆动，频率比 sway-idle 慢）。
   外层 .ve-pixel 由运行时用 left/top 沿轨迹移动，动作动画作用在内层 img。
   （按 2026-09-08 反馈取消 blink。） */
.ve-pixel{will-change:left,top}
body:not(.ve-embed) .ve-pixel{transition:none}
.ve-pix-img{display:block;will-change:transform;transform-origin:bottom center}
/* —— walk-sway：边走边摇晃。内层 img 持续小角度摇摆（比 sway-idle 频率低）+ 抬脚 ——
   走路时动画频率 ~ 0.8s 一次周期，sway-idle 频率 ~ 0.6s。走路时角度小（±5°），
   看起来像「身体在走的小晃动」。 */
@keyframes veWalkBob{
  0%,100%{transform:translateY(0) rotate(0)}
  25%{transform:translateY(-2px) rotate(-3deg)}
  50%{transform:translateY(0) rotate(0)}
  75%{transform:translateY(-2px) rotate(3deg)}
}
.ve-pixel.px-walk .ve-pix-img{animation:veWalkBob 0.8s ease-in-out infinite}
/* —— jump：跳两下立住（更高+二次小跳）。*/
@keyframes veOneJump{
  0%   {transform:translateY(0) scaleY(1)}
  18%  {transform:translateY(-36px) scaleY(0.94)}
  35%  {transform:translateY(0) scaleY(1.06)}
  50%  {transform:translateY(-14px) scaleY(0.96)}
  65%  {transform:translateY(0) scaleY(1.02)}
  100% {transform:translateY(0) scaleY(1)}
}
.ve-pixel.px-act-jump .ve-pix-img{animation:veOneJump 1.1s ease-out forwards}
/* —— sway-idle：原地左右摇晃（±14°，比之前 12° 更明显 + 1.5 个周期）。*/
@keyframes veSway{
  0%,100%{transform:rotate(0)}
  16%  {transform:rotate(-14deg)}
  33%  {transform:rotate(12deg)}
  50%  {transform:rotate(-10deg)}
  66%  {transform:rotate(8deg)}
  83%  {transform:rotate(-4deg)}
}
.ve-pixel.px-act-sway .ve-pix-img{animation:veSway 0.9s ease-in-out}
.ve-pixel.px-idle .ve-pix-img{animation:veSway 1.8s ease-in-out 1}
.ve-pixel.px-idle::after{content:'Z';position:absolute;right:-10px;top:-12px;font:700 12px 'DM Mono',monospace;color:var(--muted);animation:veIdleZ 1.8s ease-out forwards}
@keyframes veIdleZ{from{opacity:0;transform:translateY(5px)}25%{opacity:.8}to{opacity:0;transform:translateY(-12px)}}
/* hero 下方的横线分割线：作为一个独立 Canvas Element 渲染（可删除、可持久化），
   取代原本直接画在 .hero 上的 border-bottom，从而让「删除分割线」能真正生效。 */
.hero-rule{height:1px;background:var(--ink)}
.eyebrow{font:12px 'DM Mono',monospace;text-transform:uppercase;letter-spacing:.05em;color:var(--hero-eyebrow)}
/* 姓名与定位之间增加呼吸空间，intro 保留用户输入的换行 */
.hero h1{margin-bottom:18px}
.hero .role{margin-top:0}
.hero .intro{white-space:pre-line;margin-top:14px}
/* 自由图片层：绝对定位于文档坐标的浮层（添加图片功能） */
.shell{position:relative}
.ve-free-layer{position:absolute;left:0;top:0;right:0;bottom:0;pointer-events:none;z-index:5}
.ve-host{position:relative}
.ve-tail-zone{position:relative;min-height:0}
.ve-free-img{position:absolute;pointer-events:none;user-select:none;display:block}
.ve-embed .ve-free-img{pointer-events:auto;cursor:grab}
.ve-embed .ve-free-img.ve-el-selected{outline:2px solid var(--accent);cursor:grabbing}
.ve-free-handle{position:absolute;width:12px;height:12px;background:#fff;border:2px solid var(--accent);border-radius:3px;pointer-events:auto;display:none;z-index:7}
.ve-free-handle.ve-fh-nw{left:-7px;top:-7px;cursor:nwse-resize}
.ve-free-handle.ve-fh-ne{right:-7px;top:-7px;cursor:nesw-resize}
.ve-free-handle.ve-fh-sw{left:-7px;bottom:-7px;cursor:nesw-resize}
.ve-free-handle.ve-fh-se{right:-7px;bottom:-7px;cursor:nwse-resize}
.ve-free-handle.ve-fh-n{left:50%;top:-7px;margin-left:-6px;cursor:ns-resize}
.ve-free-handle.ve-fh-s{left:50%;bottom:-7px;margin-left:-6px;cursor:ns-resize}
.ve-free-handle.ve-fh-w{left:-7px;top:50%;margin-top:-6px;cursor:ew-resize}
.ve-free-handle.ve-fh-e{right:-7px;top:50%;margin-top:-6px;cursor:ew-resize}
.ve-embed .ve-free-img.ve-el-selected .ve-free-handle{display:block}
/* 拖动自由图片时高亮「松手会归属到哪个区块」 */
.ve-anchor-hi{outline:2px dashed var(--accent);outline-offset:-2px;outline-color:var(--accent)}
.ve-sec-name{opacity:.8;font-weight:600;margin-left:4px}
.ve-snap{position:absolute;pointer-events:none;z-index:6}
.ve-snap-v{top:0;bottom:0;width:0;border-left:1px dashed var(--accent)}
.ve-snap-h{left:0;right:0;height:0;border-top:1px dashed var(--accent)}
/* 活动轨迹：画线 overlay + 完成/取消 浮层（VE 画布内） */
.ve-draw-layer{position:fixed;left:0;top:0;width:100vw;height:100vh;pointer-events:none;z-index:60}
.ve-draw-svg{position:absolute;left:0;top:0;width:100vw;height:100vh;overflow:visible;pointer-events:none}
.ve-draw-done{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);display:flex;align-items:center;gap:10px;background:#1c2433;color:#fff;padding:10px 14px;border-radius:10px;z-index:70;box-shadow:0 6px 24px rgba(0,0,0,.25)}
.ve-draw-tip{font-size:12px;color:#cfe0f5;margin-right:4px}
.ve-draw-done .ve-btn{background:#fff;color:#1c2433;border:0;border-radius:6px;padding:6px 12px;font:600 12px 'DM Mono',monospace;cursor:pointer}
.ve-draw-done .ve-btn:hover{background:#ffe1d6}
@media(max-width:720px){
  .hero{flex-direction:column;gap:20px}
  .hero-avatar{align-self:flex-end}
  /* Desktop 数值仍保留在 Design；手机只在画面层限制上限，避免形象遮挡标题。 */
  .ve-pixel{max-width:min(28vw,100px)!important;max-height:min(28vw,100px)!important}
  .hero h1{font-size:clamp(46px,13vw,64px)!important;line-height:1.04}
  .role{font-size:clamp(16px,5vw,19px)!important}
  .intro,.project-summary,.exp-summary,.about-main .bodycopy{font-size:14px;line-height:1.7}
  .entry-title{font-size:clamp(22px,7vw,28px)!important}
  .works-category{font-size:clamp(18px,5.8vw,21px)}
  .project h4,.exp-company{font-size:16px}
  .project-role,.exp-position,.exp-date,.meta-title{font-size:12px}
}

/* AI Project 可包含多个独立项目，保留 Case Study 主体而不挤占其内容。 */
.ai-project-list{display:block;margin-top:30px}
.ai-project-card{border-top:1px solid var(--line);padding:22px 0;display:block}
.ai-project-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.ai-project-no{font:500 13px 'DM Mono',monospace;color:var(--muted)}
.ai-project-card h3{font-size:19px;font-weight:500;margin:0}
.ai-project-role{font-size:13px;color:var(--muted)}
.ai-project-summary{margin:10px 0 0;color:#4a463f;line-height:1.75;max-width:760px}
.ai-project-tech{margin-top:12px;display:flex;flex-wrap:wrap;gap:8px}
.ai-project-highlights{margin-top:12px;max-width:760px}
.ai-project-highlights .label{font-size:13px;font-weight:600;letter-spacing:.03em;color:var(--muted);display:block;margin-bottom:6px}
.ai-project-highlights ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.ai-project-highlights li{font-size:14px;color:#4a463f;line-height:1.6;padding-left:14px;position:relative}
.ai-project-highlights li::before{content:"";position:absolute;left:0;top:9px;width:5px;height:5px;border-radius:50%;background:var(--accent)}
.ai-project-links{margin-top:14px;display:flex;gap:10px;flex-wrap:wrap}
.ai-project-cover{width:100%;max-width:520px;height:auto;display:block;margin-top:14px;background:var(--soft);border-radius:6px}
.ai-project-shots{margin-top:14px;display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.ai-project-shots img{width:100%;height:auto;display:block;background:var(--soft);border-radius:6px}

/* —— About 面板：单源展示（About Me 只在面板里出现一次）—— */
.about-grid{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:60px}
.about-main .bodycopy{white-space:pre-line;max-width:680px;line-height:1.85;font-size:16px;margin:0}
.about-side{display:flex;flex-direction:column;gap:26px}
.about-block h4{font-size:14px;font-weight:600;letter-spacing:.02em;margin:0 0 10px;color:var(--ink)}
.about-list{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.about-list li{padding:10px 0;border-bottom:1px solid var(--line);font-size:14px;line-height:1.6;color:#4a463f}

/* Contact / Links：每项独立显示，value 可点击复制 */
/* meta-band：hero 下方、directory 上方的独立区块，承载 Contact/Links + 技能 */
.meta-band{margin-top:40px;display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:40px 60px}
.meta-block{margin-bottom:0}
.meta-title{font-size:13px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin:0 0 12px}
.contact-list{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.contact-item{display:flex;align-items:baseline;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.contact-label{font-size:13px;color:var(--muted);flex-shrink:0;min-width:64px}
.contact-value{background:none;border:0;padding:0;font:inherit;font-size:14px;color:var(--ink);text-align:left;cursor:pointer;border-bottom:1px dashed transparent;transition:border-color .15s ease,color .15s ease}
.contact-value:hover{color:var(--accent);border-bottom-color:var(--accent)}
.contact-value.copied{color:var(--accent)}

/* Keyword Block：About 的 highlights 视觉形式 */
.keyword-block{margin-top:22px;display:flex;flex-wrap:wrap;gap:8px}
.kw-chip{
  display:inline-block;
  padding:6px 12px;
  border:1px solid var(--line);
  border-radius:999px;
  background:var(--soft);
  font-size:13px;
  line-height:1.2;
  color:var(--ink);
}
@media(max-width:720px){.about-grid{grid-template-columns:1fr;gap:28px}}

/* —— Showreel —— */
/* 作为 Works 一级模块折叠展开，位于 works-category-body 内：去掉大上边距，视频受控居中不撑破 */
.showreel{background:var(--dark);color:var(--paper);padding:28px;margin-top:8px;border-radius:2px}
.showreel h2{margin:6px 0 24px;font:500 30px 'Playfair Display',serif}
.showreel video{width:100%;background:#101010;display:block;max-height:560px;object-fit:contain}
.chapters{margin-top:18px}
.chapter{background:none;border:0;border-top:1px solid #575650;width:100%;color:inherit;padding:13px 0;display:grid;grid-template-columns:34px 130px 1fr 1.3fr;text-align:left;cursor:pointer}
.chapter:hover{color:var(--accent)}
.chapter.active{color:var(--accent)}
.ch-time{font:12px 'DM Mono',monospace;color:#a9a49a}
.ch-index,.ai-project-no{font:600 11px/1 'DM Mono',monospace;color:var(--accent);letter-spacing:.08em;align-self:center}
.showreel-empty{border:1px dashed #77736b;padding:18px;color:#d4d0c6;font-size:13px;line-height:1.7}
.ch-role{color:#a9a49a;font-size:13px}

@media(max-width:720px){
  .project-head{flex-wrap:wrap}
  .project-head .project-role{margin-left:0}
  .project-media.media-duo,.project-media.media-grid{grid-template-columns:1fr}
  /* 手机上的经历条目：编号 + 公司 + 日期 / 职位分两行，避免挤成一团 */
  .experience-item summary{grid-template-columns:28px minmax(0,1fr) auto;gap:6px 12px;align-items:baseline}
  .exp-company{grid-column:2;grid-row:1}
  .exp-position{grid-column:2;grid-row:2;font-size:12px}
  .exp-date{grid-column:3;grid-row:2;font-size:11px}
  .experience-item .expand-label{grid-column:3;grid-row:1;justify-self:end}
  .chapter{grid-template-columns:28px 86px 1fr}
    .ch-role{grid-column:3}
  .showreel{padding:20px;margin-left:-20px;margin-right:-20px}
}

/* —— 顶部入口：编辑器 / 发布（克制、不破坏作品集风格）—— */
.top-right{display:flex;align-items:center;gap:20px}
.top-actions{display:flex;align-items:center;gap:6px}
.top-btn{
  background:none;border:1px solid transparent;color:var(--muted);
  font:12px 'DM Mono',monospace;letter-spacing:.04em;text-transform:uppercase;
  padding:4px 8px;cursor:pointer;transition:color .15s ease,border-color .15s ease;
}
.top-btn:hover{color:var(--accent);border-color:var(--line)}
@media(max-width:720px){
  .top-right{flex-direction:column;align-items:flex-end;gap:8px}
  .top{flex-wrap:wrap}
}

/* —— Publish 面板 —— */
.publish-dialog{
  width:min(640px,92vw);max-height:86vh;overflow:auto;
  padding:0;border:1px solid var(--line);border-radius:6px;
  background:var(--paper);color:var(--ink);
  font-family:var(--editor-font,'Noto Sans SC'),sans-serif;
}
.publish-dialog::backdrop{background:rgba(0,0,0,.4)}
.publish-head{display:flex;justify-content:space-between;align-items:center;padding:20px 24px;border-bottom:1px solid var(--line)}
.publish-head h2{font:500 22px 'Playfair Display',serif;margin:0}
.publish-close{background:none;border:0;font-size:24px;line-height:1;color:var(--muted);cursor:pointer;padding:0 4px}
.publish-close:hover{color:var(--ink)}
.publish-section{padding:20px 24px;border-bottom:1px solid var(--line)}
.publish-section:last-child{border-bottom:0}
.publish-section h3{font-size:14px;font-weight:600;letter-spacing:.02em;margin:0 0 10px;color:var(--ink)}
.publish-desc{font-size:13px;line-height:1.7;color:var(--muted);margin:0 0 14px}
.publish-placeholder{background:var(--soft);border:1px dashed var(--line);border-radius:4px;padding:16px}
.publish-tag{display:inline-block;font:12px 'DM Mono',monospace;color:var(--accent);letter-spacing:.04em;margin-bottom:8px}
.publish-placeholder p{font-size:13px;line-height:1.6;color:var(--muted);margin:0}
.publish-actions{display:flex;flex-wrap:wrap;gap:10px}
.publish-btn{
  display:inline-block;padding:10px 16px;border:1px solid var(--ink);
  background:none;color:var(--ink);font:12px 'DM Mono',monospace;
  text-decoration:none;cursor:pointer;transition:background .15s ease,color .15s ease;
}
.publish-btn:hover{background:var(--ink);color:var(--paper)}
.publish-btn.primary{background:var(--ink);color:var(--paper)}
.publish-btn.primary:hover{background:var(--accent);border-color:var(--accent)}
.publish-btn[disabled]{opacity:.4;cursor:not-allowed}
.publish-btn[disabled]:hover{background:none;color:var(--ink)}
.publish-btn.st-done{background:#1a7f37;border-color:#1a7f37;color:#fff}
.publish-btn.st-done:hover{background:#15672c;border-color:#15672c}
.publish-hint{font-size:12px;line-height:1.6;color:var(--muted);margin:10px 0 0}

/* —— 右上角「发布」入口（仅纯作品集浏览场景渲染） —— */
.publish-open{padding:6px 14px;border:1px solid var(--ink);background:none;color:var(--ink);font:12px 'DM Mono',monospace;letter-spacing:.04em;cursor:pointer;border-radius:4px;margin-right:10px}
.publish-open:hover{background:var(--ink);color:var(--paper)}
@media print{.publish-open{display:none !important}}
.ve-embed .publish-open{display:none !important}
/* —— 公开链接 UI —— */
.publish-link-row{display:flex;gap:8px;align-items:center;margin:0 0 12px}
.publish-link-input{flex:1 1 auto;min-width:0;padding:9px 10px;border:1px solid var(--line);border-radius:6px;background:var(--paper);color:var(--ink);font:12px 'DM Mono',monospace}
.publish-input{display:block;width:100%;box-sizing:border-box;padding:9px 10px;margin:6px 0 12px;border:1px solid var(--line);border-radius:6px;background:var(--paper);color:var(--ink);font:13px/1.4 'Noto Sans SC',sans-serif}
.publish-err{font-size:13px;line-height:1.6;color:#c0392b;white-space:pre-wrap;margin:10px 0 0}
.publish-warn{font-size:13px;line-height:1.6;color:#a86a00;white-space:pre-wrap;margin:10px 0 0}
.publish-ok{font-size:13px;line-height:1.6;color:#1f7a45;white-space:pre-wrap;margin:10px 0 0}
/* —— 发布实时进度（大视频要传好几分钟，必须让用户看到在动） —— */
.pub-progress{margin:12px 0 0;border:1px solid var(--line);border-radius:8px;background:var(--soft);padding:10px 12px}
.pub-prog-stage{font-size:13px;font-weight:600;color:var(--ink);margin-bottom:8px;line-height:1.5}
.pub-prog-bar{height:8px;border-radius:5px;background:#e4e4ea;overflow:hidden}
.pub-prog-bar i{display:block;height:100%;background:linear-gradient(90deg,#1a7f37,#2ea043);transition:width .6s ease;min-width:2px}
.pub-prog-pct{font-size:12px;color:var(--muted);margin-top:5px;text-align:right;font-variant-numeric:tabular-nums}
/* —— Provider 切换（Cloudflare / GitHub Pages） —— */
.publink-tabs{display:flex;gap:6px;margin:0 0 14px;border-bottom:1px solid var(--line)}
.publink-tab{padding:7px 14px;border:1px solid transparent;border-bottom:none;background:none;color:var(--ink);opacity:.6;font:12px 'DM Mono',monospace;letter-spacing:.03em;cursor:pointer;border-radius:6px 6px 0 0;margin-bottom:-1px}
.publink-tab:hover{opacity:.9}
.publink-tab.active{opacity:1;border-color:var(--line);background:var(--paper);font-weight:600}
.publish-desc code{background:#f1f1f4;padding:1px 5px;border-radius:4px;font:12px 'DM Mono',monospace}
/* —— PDF 导出引导横幅（打印时不出现） —— */
#pdf-banner{position:fixed;top:0;left:0;right:0;z-index:9999;padding:14px 18px;background:#1f4e8c;color:#fff;font:14px/1.5 'Noto Sans SC',sans-serif;text-align:center}
#pdf-banner b{color:#ffe08a}
@media print{#pdf-banner{display:none !important}}

/* —— Publish 状态行 —— */
.publish-status{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.publish-status-row{display:flex;align-items:center;gap:12px;font-size:13px}
.publish-status-label{color:var(--muted);min-width:120px}
.publish-status .publish-tag{margin-bottom:0}
.publish-tag.dim{color:var(--muted);opacity:.6}

/* —— 底部版本状态条 —— */
#version-bar{
  position:fixed;left:16px;right:16px;bottom:14px;z-index:9999;
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  padding:10px 14px;border:1px solid var(--line);border-radius:10px;
  background:rgba(255,255,255,.94);backdrop-filter:blur(6px);
  box-shadow:0 6px 24px rgba(0,0,0,.10);
  font:12px/1.5 'DM Mono',monospace;color:var(--ink);
}
:root[data-mode="dark"] #version-bar{background:rgba(28,28,26,.94);color:#f1eee7}
#version-bar .vb-dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
#version-bar .vb-dot.vb-draft{background:#e08a2e}
#version-bar .vb-dot.vb-pub{background:#2e9e5b}
#version-bar .vb-text b{font-weight:600}
#version-bar .vb-spacer{flex:1 1 auto}
#version-bar .vb-diff{color:var(--muted);font-size:11px}
#version-bar .vb-link{color:var(--ink);text-decoration:none;border-bottom:1px solid var(--line);padding-bottom:1px}
#version-bar .vb-link:hover{border-bottom-color:var(--ink)}
#version-bar .vb-btn{
  border:1px solid var(--ink);background:var(--ink);color:var(--paper);
  padding:6px 14px;border-radius:6px;cursor:pointer;font:12px 'DM Mono',monospace;
}
#version-bar .vb-btn:hover{opacity:.85}
#version-bar .vb-btn:disabled{opacity:.5;cursor:default}
@media(max-width:640px){
  #version-bar{left:8px;right:8px;bottom:8px;gap:8px;padding:8px 10px}
  #version-bar .vb-text{font-size:11px}
}
@media print{ #version-bar{display:none !important} }

/* —— PDF 打印（?print=1）：隐藏编辑器 UI，优化分页 —— */
@media print{
  @page{margin:14mm}
  .top-actions,.entry-btn .expand-label,.project-toggle,.works-category-head .expand-label,
  .experience-item .expand-label,.footer,.top-right,.publish-open{display:none !important}
  .shell{max-width:100% !important}
  .entry-panel{display:block !important}
  .entry .entry-panel{max-height:none !important;overflow:visible !important}
  details>summary{cursor:default}
  details.works-group,details.project,details.experience-item{break-inside:avoid}
  .entry,.ai-project-card,img,video,.showreel-video,.pm-item{break-inside:avoid}
  a,button{color:var(--ink) !important}
  body{background:#fff !important}
  video,img{max-width:100% !important}
  /* 主要区块之间尽量分页，避免章节标题被截断在页尾 */
  .directory,.resume,.contact,.about,.experience,.works,.showreel,.ai-voices{page-break-before:auto}
}

/* —— Visual Editor 嵌入模式 ?ve=1 —— */
/* 当本样式表作为 iframe 内容被 /visual-editor/ 加载时启用。
   - 隐藏底部版本状态条（父窗口里有自己的）
   - 隐藏顶部「编辑器 / 发布」按钮（避免重复）
   - 给每个 entry 加「编辑」入口（嵌入由 app-v3.js 注入按钮 DOM，这里只负责样式） */
body.ve-embed #version-bar{display:none !important}
body.ve-embed .top-actions{display:none !important}
body.ve-embed .entry{position:relative;transition:outline-color .15s ease;outline:2px solid transparent;outline-offset:-2px}
body.ve-embed .entry:hover{outline-color:#1f4e8c33}
body.ve-embed .entry.ve-section-active{outline-color:#1f4e8c}
body.ve-embed .ve-edit-btn{
  position:absolute;top:14px;right:14px;z-index:10;
  display:none;
  padding:6px 12px;border:1px solid #1c2433;border-radius:6px;
  background:#fff;color:#1c2433;cursor:pointer;
  font:12px/1 'DM Mono',monospace;letter-spacing:.04em;
  box-shadow:0 4px 14px rgba(0,0,0,.08);
  transition:background .15s ease,color .15s ease;
}
body.ve-embed .entry:hover .ve-edit-btn,
body.ve-embed .entry.ve-section-active .ve-edit-btn{display:inline-block}
body.ve-embed .ve-edit-btn:hover{background:#1c2433;color:#fff}

/* ===== VE 直接编辑层（画布直改：文字 / 间距 / 图片） ===== */
body.ve-embed{position:relative;overflow-x:hidden}
.ve-toolbar{
  position:fixed;top:0;left:50%;transform:translateX(-50%);z-index:9999;
  display:flex;align-items:center;gap:6px;flex-wrap:wrap;
  background:rgba(255,255,255,.96);border:1px solid #d8d4ca;border-radius:0 0 10px 10px;
  padding:6px 10px;box-shadow:0 6px 22px rgba(0,0,0,.10);
  font:12px/1.4 'DM Mono',monospace;letter-spacing:.02em;color:#2a2620;
}
.ve-tb-title{font-weight:700;margin-right:4px}
.ve-tb-btn{
  border:1px solid #cfc8b8;background:#fff;color:#2a2620;border-radius:6px;
  padding:4px 10px;cursor:pointer;font:inherit;line-height:1.3;
}
.ve-tb-btn.active{background:#1f4e8c;border-color:#1f4e8c;color:#fff}
.ve-tb-btn:hover:not(.active){background:#f0ede4}
.ve-tb-hint{color:#8a8675;margin-left:8px;max-width:340px}
@media (max-width:900px){.ve-tb-hint{display:none}}

body.ve-edit-mode{cursor:crosshair}
body.ve-noselect,body.ve-noselect *{user-select:none}

/* 文字编辑态 */
.ve-field-editing{
  outline:2px dashed var(--accent,#e64e2e) !important;
  outline-offset:2px;cursor:text;border-radius:2px;
  background:rgba(255,255,255,.55);
}
body.ve-m-text [data-field]:hover{outline:1px dashed var(--accent,#e64e2e);cursor:text}
body.ve-m-text [data-static]{cursor:not-allowed;opacity:.9}

/* 元素模式（PPT 式点选）：hover 高亮 → 点击选中 → 浮出小工具条 */
body.ve-m-select{cursor:default}
.ve-el-hover{
  outline:1.5px dashed var(--accent,#e64e2e) !important;
  outline-offset:2px;cursor:pointer;
}
.ve-el-selected{
  outline:2px solid var(--accent,#e64e2e) !important;
  outline-offset:2px;
}
/* 一级 Section 仅作为右侧上下文，不需要用整块浅蓝选区覆盖画布。
   图片、文字等可编辑元素仍保留自己的轻量选中提示。 */
.entry.ve-el-selected{
  outline:0 !important;
  background:transparent !important;
}
/* 元素浮动工具条 —— absolute 相对 body，随内容一起滚动，不会飘 */
.ve-el-bar{
  position:absolute;z-index:9995;display:flex;gap:4px;
  padding:3px;background:#1f2937;border-radius:8px;
  box-shadow:0 4px 14px rgba(0,0,0,.28);white-space:nowrap;
}
.ve-el-bar button{
  border:0;background:transparent;color:#e8eef7;cursor:pointer;
  font:11px/1 'DM Mono',monospace;padding:5px 8px;border-radius:5px;
}
.ve-el-bar button:hover{background:#334155}
.ve-el-bar button[disabled]{opacity:.55;cursor:default}
.ve-el-bar button.armed{background:#dc2626;color:#fff;font-weight:700}
.ve-el-bar button[data-a="del"]:hover{background:#b91c1c;color:#fff}
/* 「每行 N 个」的分段按钮：4 个数字，当前生效的那个高亮 */
.ve-el-bar .ve-bar-seg{color:#8fa3bd;font:11px/1 'DM Mono',monospace;padding:5px 4px 5px 7px;border-right:1px solid #37475e;margin-right:3px}
.ve-el-bar button[data-a="row"]{min-width:22px;text-align:center;padding:5px 6px;font-weight:700}
.ve-el-bar button[data-a="row"].on{background:#1f4e8c;color:#fff}

/* 间距杆 —— 用 absolute 锚定在文档坐标上（body.ve-embed 是 position:relative 的定位父级），
   页面滚动时随对应空隙一起移动，天然"钉住"、不飘不跳 */
.ve-space-bar{
  position:absolute;z-index:9990;cursor:ns-resize;
  display:flex;align-items:center;gap:6px;transform:translateY(-50%);
  background:#1f4e8c;color:#fff;border-radius:8px;padding:3px 8px;
  font:11px/1 'DM Mono',monospace;box-shadow:0 3px 10px rgba(0,0,0,.22);
  white-space:nowrap;
}
.ve-space-bar::before{content:'↕';margin-right:2px}
.ve-space-label{opacity:.9}
.ve-space-val{background:rgba(255,255,255,.22);border-radius:4px;padding:0 5px;font-weight:700}
.ve-space-bar:hover{background:#0f1622}

/* 图片角柄 —— PPT 观感：白底蓝边小方块，四角 + 左右边中点，只在「选中项」上出现。
   之前的 16px 深蓝方块 + ◢/⋮ 文字，一屏 28 个一起显示，视觉上非常乱，
   现在改为「谁被选中谁才有手柄」，其余对象只给虚线轮廓。 */
.ve-img-handle{
  position:fixed;z-index:9991;width:11px;height:11px;cursor:nwse-resize;
  background:#fff;border:2px solid #1f4e8c;border-radius:2px;
  display:flex;align-items:center;justify-content:center;
  font:9px/1 sans-serif;color:#1f4e8c;
  box-shadow:0 1px 4px rgba(0,0,0,.28);
}
/* PPT 式六柄：四角保持纵横比（这里表现为改宽度），左右边中点只改宽度 */
.ve-img-handle.ve-h-nw,.ve-img-handle.ve-h-se{cursor:nwse-resize}
.ve-img-handle.ve-h-ne,.ve-img-handle.ve-h-sw{cursor:nesw-resize}
.ve-img-handle.ve-h-w,.ve-img-handle.ve-h-e{cursor:ew-resize}
.ve-img-handle:hover{background:#e64e2e;border-color:#fff;transform:scale(1.25)}
/* 注意：模式类加在 <html> 上（setMode 里 root = document.documentElement），
   所以选择器必须是 html.ve-m-image，写 body.ve-m-image 会完全失效。
   对象轮廓只在「图片尺寸与位置」模式下出现，且分两档：可调（虚线）/ 已选中（实线）。 */
html.ve-m-image .ve-size-target{outline:1px dashed rgba(31,78,140,.45);outline-offset:3px}
html.ve-m-image .ve-size-target:hover{outline:2px dashed #1f4e8c}
html.ve-m-image .ve-size-selected{outline:2px solid #1f4e8c;outline-offset:3px}
html.ve-m-image [data-ve-media-box].ve-size-target{outline-offset:6px}
/* 拖动时的辅助层：虚线外框 + 竖向对齐参考线 + 尺寸气泡 */
.ve-size-frame{position:fixed;z-index:9989;border:1px dashed #1f4e8c;pointer-events:none;box-shadow:0 0 0 1px rgba(255,255,255,.6) inset}
.ve-guide-v{position:fixed;top:0;bottom:0;width:0;border-left:1px dashed rgba(230,78,46,.55);pointer-events:none;z-index:9988}
.ve-guide-v.ve-guide-on{border-left:2px solid #e64e2e;box-shadow:0 0 6px rgba(230,78,46,.5)}
/* 横向对齐参考线（并排图之间对齐时用） */
.ve-guide-h{position:fixed;left:0;right:0;height:0;border-top:1px dashed rgba(230,78,46,.55);pointer-events:none;z-index:9988}
.ve-guide-h.ve-guide-on{border-top:2px solid #e64e2e;box-shadow:0 0 6px rgba(230,78,46,.5)}
.ve-size-tip{
  position:fixed;z-index:9993;background:#1f4e8c;color:#fff;
  font:11px/1.5 -apple-system,"Segoe UI",sans-serif;padding:3px 8px;border-radius:3px;
  pointer-events:none;white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,.25)
}

/* —— 媒体项独立控制：每项 6 柄调自己 + 顶部 ⠿ 换位置 + 分栏分隔条 —— */
.ve-media-movable{cursor:grab}
.ve-media-dragging{opacity:.55}
/* 移动柄：放在顶部中央（上边中点本来就不做缩放，位置正好空着） */
.ve-img-handle.ve-move-handle{cursor:grab;background:#0f1622;border-color:#fff;color:#fff;width:20px;height:13px;border-radius:3px;font-size:9px;letter-spacing:1px}
.ve-img-handle.ve-move-handle:active{cursor:grabbing}
.ve-img-handle.ve-move-handle:hover{background:#e64e2e}
/* 分栏分隔条：拖它 = 改「正文 : 媒体栏」的比例（整栏一起变，这是比例，不是单项大小） */
.ve-col-divider{
  position:fixed;z-index:9992;width:10px;cursor:col-resize;border-radius:5px;
  background:linear-gradient(180deg,rgba(31,78,140,.25),rgba(31,78,140,.75),rgba(31,78,140,.25));
  box-shadow:0 0 0 1px rgba(255,255,255,.7);
}
.ve-col-divider::after{
  content:'⇔';position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  color:#fff;font-size:11px;line-height:1;text-shadow:0 1px 2px rgba(0,0,0,.45);
}
.ve-col-divider:hover{background:#e64e2e}
/* 拖动换位时的浮标 / 插入指示线 */
.ve-media-ghost{
  position:fixed;z-index:9995;pointer-events:none;white-space:nowrap;
  background:#0f1622;color:#fff;font:11px/1.4 -apple-system,"Segoe UI",sans-serif;
  padding:4px 9px;border-radius:4px;box-shadow:0 4px 14px rgba(0,0,0,.3);
}
.ve-media-ghost.ve-bad{background:#8c1f1f}
.ve-drop-line{
  position:fixed;z-index:9994;height:3px;pointer-events:none;border-radius:2px;background:#e64e2e;
  box-shadow:0 0 0 1px rgba(255,255,255,.85),0 0 10px rgba(230,78,46,.6);
}
/* 横排容器里插入位置是「左右」关系 → 用竖向插入线 */
.ve-drop-line.ve-drop-v{height:auto;width:3px}
/* 添加图片：选完文件后画布底部的「放置提示条」（取代只靠一句 toast 的模糊引导） */
.ve-place-bar{
  position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:9996;
  display:flex;align-items:center;gap:10px;
  background:#0f1622;color:#fff;padding:9px 14px;border-radius:8px;
  font:12px/1.4 -apple-system,"Segoe UI",sans-serif;
  box-shadow:0 8px 26px rgba(0,0,0,.32);max-width:92%;
}
.ve-place-bar .vpb-thumb{width:34px;height:34px;object-fit:cover;border-radius:4px;border:1px solid rgba(255,255,255,.3);flex-shrink:0}
.ve-place-bar b{font-weight:600}
.ve-place-bar .vpb-hint{opacity:.75}
.ve-place-bar .ve-btn{background:#fff;color:#0f1622;border:0;border-radius:5px;padding:5px 10px;font:600 12px -apple-system,"Segoe UI",sans-serif;cursor:pointer;white-space:nowrap}
.ve-place-bar .ve-btn.ghost{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.45)}
html.ve-m-addimg{cursor:copy}
html.ve-m-addimg .project-detail{outline:1px dashed rgba(31,78,140,.45);outline-offset:2px}
html.ve-m-addimg [data-ve-media-box],
html.ve-m-addimg [data-ve-media-below]{outline:2px dashed rgba(230,78,46,.6);outline-offset:3px}
html.ve-dragging-media .ve-img-handle,
html.ve-dragging-media .ve-col-divider{pointer-events:none;opacity:.3}
html.ve-dragging-media [data-ve-media-item]{outline:none!important}
/* 空容器：平时隐藏；进「媒体尺寸」模式才显出来当投放区（这样「挪到正文下方」后还能挪回侧栏） */
[data-ve-empty]{display:none}
html.ve-m-image .project-media[data-ve-empty],
html.ve-m-image .project-media-below[data-ve-empty]{
  display:flex;min-height:88px;align-items:center;justify-content:center;
  outline:1px dashed rgba(31,78,140,.5);outline-offset:2px;border-radius:4px;
}
html.ve-m-image .project-media[data-ve-empty]::before,
html.ve-m-image .project-media-below[data-ve-empty]::before{
  content:'拖媒体到这里';color:#1f4e8c;opacity:.7;
  font:11px/1 -apple-system,"Segoe UI",sans-serif;
}

/* —— Showreel 多项目：每个 Showreel 项目一个块（名称/角色 + 视频 + 章节 + 外链） —— */
.showreel-project{border-top:1px solid var(--line);padding:26px 0;display:grid;gap:14px}
.showreel-project:first-child{border-top:none;padding-top:0}
.srp-head{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.srp-head .srp-name{font-size:22px;font-weight:500;margin:0}
.srp-head .srp-role{color:#6b665c;font-size:14px}
.showreel-ext{margin:0}

</style>

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
// 「正文下方」整行媒体区里，项与项之间的间距（必须与 public-v2.css 的 .project-media-below gap 一致）。

const BELOW_GAP_PX = 16;
// 取「正文下方」整行区的间距（用户可在工具条调节）；没设过就回退到默认 16px，与 CSS 一致。
const belowGapOf = (layout) => {

  return Number.isFinite(v) ? Math.max(0, Math.min(120, v)) : BELOW_GAP_PX;

const secs=t=>{const p=String(t||'0').split(':').map(Number);return p.length===3?p[0]*3600+p[1]*60+p[2]:p[0]*60+(p[1]||0)};
const url=m=>m?.url||'';
